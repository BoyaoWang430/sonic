name: Unit Test (RISC-V)

on: pull_request

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        go-version: [1.26.x]
        riscv_profile:
          - goriscv64: rva22u64
            qemu_cpu: rv64,zba=true,zbb=true,zbs=true
          - goriscv64: rva23u64
            qemu_cpu: rv64,v=true,vlen=128,zba=true,zbb=true,zbs=true,zicond=true,zfa=true,zfhmin=true,zcb=true
          - goriscv64: rva23u64
            qemu_cpu: rv64,v=true,vlen=256,zba=true,zbb=true,zbs=true,zicond=true,zfa=true,zfhmin=true,zcb=true

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU user-mode for riscv64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build and Run Unit Tests under QEMU (${{ matrix.riscv_profile.goriscv64 }} / ${{ matrix.riscv_profile.qemu_cpu }})
        env:
          GOOS: linux
          GOARCH: riscv64
          GORISCV64: ${{ matrix.riscv_profile.goriscv64 }}
          QEMU_CPU: ${{ matrix.riscv_profile.qemu_cpu }}
          CGO_ENABLED: "0"
        run: |
          EXEC_WRAPPER="$(mktemp)"
          cat > "${EXEC_WRAPPER}" <<'EOF'
          #!/usr/bin/env bash
          exec qemu-riscv64 -cpu "${QEMU_CPU}" "$@"
          EOF
          chmod +x "${EXEC_WRAPPER}"
          GOMAXPROCS=2 go test -exec="${EXEC_WRAPPER}" -count=1 ./...
          GOMAXPROCS=2 go test -exec="${EXEC_WRAPPER}" -count=1 ./issue_test
          GOMAXPROCS=2 go test -exec="${EXEC_WRAPPER}" -count=1 ./generic_test
          GOMAXPROCS=2 go test -exec="${EXEC_WRAPPER}" -count=1 ./compatibility/
