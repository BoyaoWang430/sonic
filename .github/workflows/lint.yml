name: Lint

on: pull_request

jobs:
  misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spell check
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .github/workflows/.ignore_words
          skip: "./.git,./testdata,./skills"

  static-and-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check gofmt on core and non-legacy packages
        run: |
          unformatted=$(find . -name '*.go' \
            -not -path './skills/*' \
            -not -path './testdata/*' -not -path './issue_test/*' \
            -not -path './examples/*' -not -path './fuzz/*' \
            -not -path './generic_test/*' -not -path './external_jsonlib_test/*' \
            -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go:generate outputs are up to date
        run: |
          go generate ./...
          git diff --exit-code
      - name: Check architectural and dependency gates
        run: |
          ./scripts/check_arch_gates.sh
          ./scripts/test-riscv-build.sh
      - name: Run go vet across native and pure-Go scalar configurations
        run: |
          GOOS=linux GOARCH=amd64 go vet -unreachable=false -structtag=false -testinggoroutine=false ./...
          GOOS=linux GOARCH=arm64 go vet -unreachable=false -structtag=false -testinggoroutine=false ./...
          GORISCV64=rva22u64 GOOS=linux GOARCH=riscv64 go vet -unreachable=false -structtag=false -testinggoroutine=false ./...
          GORISCV64=rva23u64 GOOS=linux GOARCH=riscv64 go vet -unreachable=false -structtag=false -testinggoroutine=false ./...
          GOOS=linux GOARCH=amd64 go vet -tags=sonic_scalar -unreachable=false -structtag=false -testinggoroutine=false ./...
          GORISCV64=rva20u64 GOOS=linux GOARCH=riscv64 go vet -tags=sonic_scalar -unreachable=false -structtag=false -testinggoroutine=false ./...
      - name: Cross-build uncertified / stdlib-adapter fallback targets (compile-only)
        run: |
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=arm go build ./...
          GOOS=linux GOARCH=ppc64le go build ./...
          GOOS=linux GOARCH=s390x go build ./...
          GOOS=js GOARCH=wasm go build ./...
          GORISCV64=rva20u64 GOOS=linux GOARCH=riscv64 go build ./...
      - name: Test sonic_compat fallback backend
        run: |
          go test -tags=sonic_compat -count=1 . ./ast ./decoder ./encoder ./utf8 ./generic_test ./issue_test ./compatibility
