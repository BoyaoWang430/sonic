
name: Unit Test

on: pull_request

jobs:
  build:
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        go-version: [1.20.x, 1.22.x, 1.25.x, '1.27.x']
        runner_arch: [ubuntu-latest]

    runs-on: ${{ matrix.runner_arch }}
    
    steps:
      - name: Clear repository
        run: rm -fr $GITHUB_WORKSPACE && mkdir $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/go.sum
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Unit Test (Production Non-Race)
        run: |
          GOMAXPROCS=4 go test -count=1 ./...

      - name: Unit Test (Race + Coverage)
        run: |
          GOMAXPROCS=4 go test -race -covermode=atomic -coverprofile=coverage.txt ./...
  
      - name: Data Race
        run: |
          ./scripts/test_race.sh

      - name: Issue Test
        run: GOMAXPROCS=4 go test -race ./issue_test

      - name: Go 1.27 Compatibility Tests
        if: startsWith(matrix.go-version, '1.27')
        run: |
          GOEXPERIMENT=nojsonv2 GOMAXPROCS=4 go test -race ./issue_test
          GOMAXPROCS=4 go test ./compatibility/ -count=1
          GOEXPERIMENT=nojsonv2 GOMAXPROCS=4 go test ./compatibility/ -count=1

      - name: Generic Test
        run: GOMAXPROCS=4 go test -v -race ./generic_test

      - name: Lower-ISA and Pure-Go Scalar Reference Contract Tests
        if: startsWith(matrix.go-version, '1.25') || startsWith(matrix.go-version, '1.27')
        run: |
          SONIC_MODE=noavx2 GOMAXPROCS=4 go test -count=1 . ./decoder ./encoder ./ast ./utf8 ./unquote ./compatibility ./internal/native/... ./internal/decoder/optdec
          SONIC_MODE=nossse3 GOMAXPROCS=4 go test -count=1 . ./decoder ./encoder ./ast ./utf8 ./unquote ./compatibility ./internal/native/... ./internal/decoder/optdec
          SONIC_MODE=scalar GOMAXPROCS=4 go test -count=1 . ./decoder ./encoder ./ast ./utf8 ./unquote ./compatibility ./internal/native/... ./internal/decoder/optdec
          GOMAXPROCS=4 go test -tags=sonic_scalar -count=1 . ./decoder ./encoder ./ast ./utf8 ./unquote ./compatibility ./internal/native/... ./internal/decoder/optdec

      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.txt
          flags: x86,${{ matrix.runner_arch }}
          fail_ci_if_error: false
